<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>3Console</title>

    <link rel="stylesheet" href="./Style.css">

    <link
        rel="manifest"
        href="./manifest.json"
    >
</head>

<body>
    <div id="console-app">
        <header id="console-header">
            <div id="console-brand">
                <h1>3Console</h1>
                <span id="console-version">R86dev</span>
            </div>

            <button
                id="download-console-button"
                type="button"
            >
                Download 3Console
            </button>
        </header>

        <main id="console-main">
            <section id="library-screen">
                <div class="screen-heading">
                    <h2>My Games</h2>

                    <button
                        id="add-game-button"
                        type="button"
                    >
                        Add Game
                    </button>
                </div>

                <div
                    id="game-library"
                    aria-live="polite"
                >
                    <div id="empty-library">
                        <h3>No Games Installed</h3>
                        <p>Add a 3Console game package to get started.</p>
                    </div>
                </div>
            </section>

            <section id="game-screen" hidden>
                <div id="game-container"></div>

                <div id="game-controls">
                    <button
                        id="game-back-button"
                        type="button"
                    >
                        Back
                    </button>
                </div>
            </section>
        </main>

        <input
            id="game-file-input"
            type="file"
            accept=".zip,application/zip"
            hidden
        >
    </div>

    <script type="module" src="./3Console.js"></script>

    <script type="module">
        import {
            download3Console
        } from "./distributionManager.js";

        const downloadButton =
            document.getElementById(
                "download-console-button"
            );

        if (downloadButton) {
            downloadButton.addEventListener(
                "click",
                async () => {
                    const originalText =
                        downloadButton.textContent;

                    downloadButton.disabled = true;
                    downloadButton.textContent =
                        "Preparing...";

                    try {
                        await download3Console();

                        downloadButton.textContent =
                            "Downloaded";
                    } catch (error) {
                        console.error(
                            "3Console download failed:",
                            error
                        );

                        downloadButton.textContent =
                            "Download Failed";

                        setTimeout(() => {
                            downloadButton.textContent =
                                originalText;
                        }, 2000);
                    } finally {
                        setTimeout(() => {
                            downloadButton.disabled = false;

                            if (
                                downloadButton.textContent ===
                                "Downloaded"
                            ) {
                                downloadButton.textContent =
                                    originalText;
                            }
                        }, 2000);
                    }
                }
            );
        }
    </script>
</body>
</html>
